syntax = "proto3";

package simsight.v1;

import "simsight/v1/game.proto";

// Phone <-> bridge API (Connect). Every call needs the pairing token
// ("Authorization: Bearer <token>").
service CompanionService {
  // Current state first, then every change and event as it happens.
  rpc Watch(WatchRequest) returns (stream WatchResponse);

  rpc SetSpeed(SetSpeedRequest) returns (SetSpeedResponse);
  rpc SelectSim(SelectSimRequest) returns (SelectSimResponse);
  rpc CancelAction(CancelActionRequest) returns (CancelActionResponse);
  rpc SetNarration(SetNarrationRequest) returns (SetNarrationResponse);

  // Sims and objects the controlled Sim can interact with, nearest first.
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse);
  // The game's pie menu for one target.
  rpc GetInteractions(GetInteractionsRequest) returns (GetInteractionsResponse);
  // Queue an interaction from the last menu, as a click would.
  rpc RunInteraction(RunInteractionRequest) returns (RunInteractionResponse);
  // The house room by room, with what is in each room.
  rpc GetHouseMap(GetHouseMapRequest) returns (GetHouseMapResponse);
  // Answer a game window: press a button, pick rows, or type text.
  rpc RespondDialog(RespondDialogRequest) returns (RespondDialogResponse);
  // Point the game camera at a Sim: follow, close-up, or let go.
  rpc SetCamera(SetCameraRequest) returns (SetCameraResponse);
  // The controlled Sim's inventory, and moving an item into a fridge, a
  // bookcase... (the game's drag and drop, in one step).
  rpc ListInventory(ListInventoryRequest) returns (ListInventoryResponse);
  rpc MoveItem(MoveItemRequest) returns (MoveItemResponse);
  // What the Mac voice announces by itself (bridge setting, not sent to the game).
  rpc SetMacAnnounce(SetMacAnnounceRequest) returns (SetMacAnnounceResponse);
}

message WatchRequest {}

message WatchResponse {
  oneof payload {
    GameState state = 1;
    Event event = 2;
    // The game is running and connected to the bridge (false while the
    // bridge has no game, e.g. demo shutting down).
    bool game_connected = 3;
  }
}

message SetSpeedRequest {
  Speed speed = 1;
}

message SelectSimRequest {
  string sim_id = 1;
}

message CancelActionRequest {
  string sim_id = 1;
  string action_id = 2;
}

message SetNarrationRequest {
  Narration narration = 1;
}

message SetSpeedResponse {
  CommandOutcome outcome = 1;
}

message SelectSimResponse {
  CommandOutcome outcome = 1;
}

message CancelActionResponse {
  CommandOutcome outcome = 1;
}

message SetNarrationResponse {
  CommandOutcome outcome = 1;
}

message ListTargetsRequest {}

message ListTargetsResponse {
  CommandOutcome outcome = 1;
  repeated Target targets = 2;
}

message GetInteractionsRequest {
  string target_id = 1;
}

message GetInteractionsResponse {
  CommandOutcome outcome = 1;
  repeated Interaction interactions = 2;
  // Some names are still being localized by the game: ask again shortly.
  bool names_pending = 3;
}

message RunInteractionRequest {
  string target_id = 1;
  string interaction_id = 2;
}

message RunInteractionResponse {
  CommandOutcome outcome = 1;
}

message CommandOutcome {
  bool ok = 1;
  // Stable reason key when ok is false (e.g. "sim_unavailable",
  // "not_cancelable", "not_in_game", "timeout").
  string reason = 2;
}

message GetHouseMapRequest {}

message GetHouseMapResponse {
  CommandOutcome outcome = 1;
  HouseMap map = 2;
}

message RespondDialogRequest {
  string dialog_id = 1;
  // Button pressed (DialogChoice.id).
  int32 choice_id = 2;
  // Picker rows chosen (DialogRow.id), when the window is a picker.
  repeated string row_ids = 3;
  // Text typed, when the window has a text box.
  string text = 4;
}

message RespondDialogResponse {
  CommandOutcome outcome = 1;
}

enum CameraMode {
  CAMERA_MODE_UNSPECIFIED = 0;
  // Follow the Sim at the current distance.
  CAMERA_MODE_FOLLOW = 1;
  // Move close to the Sim, then follow.
  CAMERA_MODE_CLOSE = 2;
  // Stop following.
  CAMERA_MODE_FREE = 3;
}

message SetCameraRequest {
  string sim_id = 1;
  CameraMode mode = 2;
}

message SetCameraResponse {
  CommandOutcome outcome = 1;
}

message SetMacAnnounceRequest {
  MacAnnounce mac_announce = 1;
}

message SetMacAnnounceResponse {
  CommandOutcome outcome = 1;
}

message ListInventoryRequest {}

message ListInventoryResponse {
  CommandOutcome outcome = 1;
  repeated InventoryItem items = 2;
}

message MoveItemRequest {
  string item_id = 1;
  string destination_id = 2;
}

message MoveItemResponse {
  CommandOutcome outcome = 1;
}
