syntax = "proto3";

package ts4access.v1;

import "ts4access/v1/companion.proto";
import "ts4access/v1/game.proto";

// Game <-> bridge pipe. One message per line, protobuf JSON (camelCase
// field names, enum value names as strings). The game writes ToBridge lines
// on the bridge's stdin and reads ToGame lines from its stdout. Lines that
// start with "I" or "Q" instead of "{" are speech, in the original
// TS4 Access fallback-voice format (I = interrupt, Q = queue, then the
// percent-encoded text).

message Voice {
  int32 rate = 1;    // -10..10
  int32 volume = 2;  // 0..100
  string name = 3;   // part of a macOS voice name, empty for default
  string lang = 4;   // BCP 47, empty for default
}

message Hello {
  string mod_version = 1;
  string game_version = 2;
}

message CommandResult {
  string id = 1;
  CommandOutcome outcome = 2;
}

message ToBridge {
  oneof payload {
    Hello hello = 1;
    GameState state = 2;
    Event event = 3;
    CommandResult result = 4;
    Voice voice = 5;
  }
}

message ToGame {
  string id = 1;
  oneof command {
    SetSpeedRequest set_speed = 2;
    SelectSimRequest select_sim = 3;
    CancelActionRequest cancel_action = 4;
    SetNarrationRequest set_narration = 5;
  }
}
